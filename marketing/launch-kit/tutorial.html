<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fluent for Mac: install guide</title>
<link rel="stylesheet" href="paper.css">
<style>
#chip{position:absolute;left:0;right:0;top:268px;text-align:center;font-size:30px;color:var(--pen);letter-spacing:.16em}
#title{position:absolute;left:40px;right:40px;top:316px;text-align:center;font-size:82px}
#bar{position:absolute;left:190px;right:190px;top:444px;height:8px;display:flex;gap:8px}
#bar i{flex:1;border-radius:4px;background:var(--rule)}
#bar i.on{background:var(--ink)}
#bar i.now{background:var(--pen)}
#view{position:absolute;left:40px;top:490px;width:1000px;height:900px;border-radius:30px;overflow:hidden;
  background:linear-gradient(#e9e6dd,#e3dfd4);box-shadow:inset 0 0 0 2px rgba(0,0,0,.05),inset 0 20px 40px rgba(0,0,0,.05)}
#cam{position:absolute;left:0;top:0;transform-origin:0 0}
#cam img{position:absolute;left:0;top:0;display:none}
#ghost{position:absolute;display:none;background-image:url(shots/dmg.png);border-radius:18px;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.35));opacity:.92}
#typed{position:absolute;display:none;background:#292929;color:#ececec;font:13px system-ui,-apple-system,sans-serif;
  line-height:21px;padding-left:4px;white-space:nowrap;overflow:hidden}
#hint{position:absolute;left:40px;right:40px;top:1414px;text-align:center;font-size:48px;line-height:1.15}
#hint.mono{font-family:Plex;font-weight:500;font-size:40px;color:var(--ink);letter-spacing:0}
</style>
</head>
<body>
<div id="stage">
  <div class="layer center" id="intro">
    <img id="iIcon" src="shots/icon.png" style="width:330px;height:330px">
    <div class="big" id="iTitle" style="font-size:130px;margin-top:10px">Install<br>Fluent</div>
    <div class="hand" id="iSub" style="font-size:64px;margin-top:22px;transform:rotate(-2deg)">on your Mac, in 40 seconds</div>
  </div>

  <div class="layer" id="steps">
    <div class="mono" id="chip"></div>
    <div class="big" id="title"></div>
    <div id="bar"></div>
    <div id="view"><div id="cam"><div id="ghost"></div><div id="typed"></div></div></div>
    <div class="hand" id="hint"></div>
  </div>

  <div class="layer center" id="outro">
    <img id="oIcon" src="shots/icon.png" style="width:300px;height:300px">
    <div class="big" id="oTitle" style="font-size:118px;margin-top:14px">You're all set.</div>
    <div class="mono" id="oUrl" style="font-size:40px;margin-top:40px;padding:16px 30px;border:2px solid var(--ink);border-radius:12px">fluent-voice-v2.vercel.app</div>
    <div class="hand" id="oSub" style="font-size:58px;margin-top:34px">Stop typing. Start talking.</div>
  </div>

  <svg class="cursor" id="cursor" viewBox="0 0 28 40"><path d="M2 2 L2 32 L10 25 L15 37 L20 35 L15 23 L25 23 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg>
  <div class="ripple" id="ripple"></div>
</div>

<script src="lib.js"></script>
<script>
const VX = 40, VY = 490, VW = 1000, VH = 900, REST = [860, 1600];
let STEPS, SIZES, NUMBERED;

function setup(grid, sizes) {
  G = grid; STEPS = grid.steps; SIZES = sizes;
  NUMBERED = STEPS.filter(s => s.n).length;
  const cam = $("cam");
  for (const [name, [w, h]] of Object.entries(SIZES)) {
    const img = document.createElement("img");
    img.src = `shots/${name}.png`; img.id = "shot-" + name; img.style.width = w + "px"; img.style.height = h + "px";
    cam.insertBefore(img, $("ghost"));
  }
  $("bar").innerHTML = "<i></i>".repeat(NUMBERED);
}

const stepAt = t => { let s = STEPS[0]; for (const x of STEPS) if (t >= x.bar * G.bar) s = x; return s; };
const frameAt = (s, lb) => { let f = s.frames[0]; for (const x of s.frames) if (lb >= x[0]) f = x; return f; };
const prevFrame = (s, f) => s.frames[s.frames.indexOf(f) - 1];
const toPage = (cam, x, y) => [VX + VW / 2 + (x - cam[0]) * cam[2], VY + VH / 2 + (y - cam[1]) * cam[2]];

// The camera for step s at local beat lb: pans from the previous frame's camera when the shot stays
// the same, otherwise cuts (with a small settle).
function camAt(s, lb) {
  const f = frameAt(s, lb), p = prevFrame(s, f);
  const k = inout((lb - f[0]) * G.beat / 0.45);
  if (p && p[1] === f[1] && k < 1) return f[2].map((v, i) => p[2][i] + (v - p[2][i]) * k);
  return f[2];
}

// Every place the cursor has to be, in page pixels: clicks, and the start and end of a drag.
function cursorEvents(s) {
  const ev = [];
  for (const [at, x, y] of s.clicks || []) ev.push({at, pos: toPage(frameAt(s, at)[2], x, y), click: true});
  if (s.drag) {
    const c = frameAt(s, s.drag.at)[2];
    ev.push({at: s.drag.at, pos: toPage(c, ...s.drag.from), down: true});
    ev.push({at: s.drag.at + s.drag.dur, pos: toPage(c, ...s.drag.to), up: true});
  }
  return ev.sort((a, b) => a.at - b.at);
}

function renderCursor(s, lb) {
  const c = $("cursor"), r = $("ripple");
  const ev = cursorEvents(s);
  r.style.opacity = 0;
  if (!ev.length) { c.style.opacity = 0; return; }
  c.style.opacity = clamp(lb / 0.5);
  let pos = REST, prevAt = 0, pressed = false;
  for (let i = 0; i < ev.length; i++) {
    const e = ev[i];
    if (lb >= e.at) {
      pos = e.pos; prevAt = e.at;
      if (e.down) pressed = true;
      if (e.up) pressed = false;
      continue;
    }
    // travelling to e: dragging moves the whole way, otherwise the cursor sets off at most 1.1 beats before
    const prev = i ? ev[i - 1] : null;
    const from = pos;
    const startMove = prev && prev.down ? prevAt : Math.max(prevAt + 0.15, e.at - 1.1);
    const k = prev && prev.down ? inout((lb - startMove) / (e.at - startMove)) : inout((lb - startMove) / (e.at - 0.08 - startMove));
    pos = [from[0] + (e.pos[0] - from[0]) * k, from[1] + (e.pos[1] - from[1]) * k];
    break;
  }
  const last = [...ev].reverse().find(e => lb >= e.at && e.click);
  const since = last ? (lb - last.at) * G.beat : 99;
  c.style.left = (pos[0] - 5) + "px"; c.style.top = (pos[1] - 3) + "px";
  c.style.transform = `scale(${since < 0.12 || pressed ? 0.84 : 1})`;
  if (since < 0.5) {
    const k = since / 0.5;
    r.style.left = last.pos[0] + "px"; r.style.top = last.pos[1] + "px";
    r.style.opacity = 1 - k; r.style.transform = `scale(${0.3 + 1.1 * ease(k)})`;
  }
  return pos;
}

function render(t) {
  const s = stepAt(t), lt = t - s.bar * G.bar, lb = lt / G.beat;
  const inIntro = s.id === "intro", inOutro = s.id === "outro";
  let l;
  if ((l = layer("intro", 0, STEPS[1].bar * G.bar, t)) >= 0) {
    pop($("iIcon"), l, -0.2, 0.5); pop($("iTitle"), l, beats(1), 1.25); pop($("iSub"), l, beats(2), 1.2);
  }
  const outroAt = STEPS.find(x => x.id === "outro").bar * G.bar;
  if ((l = layer("outro", outroAt, 1e9, t)) >= 0) {
    pop($("oIcon"), l, 0, 0.5); pop($("oTitle"), l, beats(1), 1.2); pop($("oUrl"), l, beats(2), 1.15); pop($("oSub"), l, beats(3), 1.15);
  }
  layer("steps", STEPS[1].bar * G.bar, outroAt, t);
  if (inIntro || inOutro) { $("cursor").style.opacity = 0; $("ripple").style.opacity = 0; return; }

  // header
  $("chip").textContent = s.n ? `STEP ${s.n} OF ${NUMBERED}` : "READY";
  $("title").textContent = s.title;
  pop($("title"), lt, 0.02, 1.12); pop($("chip"), lt, 0, 1.1);
  [...$("bar").children].forEach((el, i) => {
    const n = i + 1; el.className = !s.n ? "on" : n < s.n ? "on" : n === s.n ? "now" : "";
  });
  // hint
  let hint = s.hints[0];
  for (const h of s.hints) if (lb >= h[0]) hint = h;
  const hEl = $("hint");
  hEl.className = hint[2] === "mono" ? "mono" : "hand";
  hEl.textContent = hint[1];
  rise(hEl, lt - hint[0] * G.beat, 0.1, 30, 0.25);

  // screenshot + camera
  const f = frameAt(s, lb), cam = camAt(s, lb);
  for (const img of document.querySelectorAll("#cam img")) img.style.display = img.id === "shot-" + f[1] ? "block" : "none";
  const fresh = (lb - f[0]) * G.beat, cut = !prevFrame(s, f) || prevFrame(s, f)[1] !== f[1];
  const settle = cut ? 1 + 0.05 * (1 - ease(fresh / 0.3)) : 1;
  const z = cam[2] * settle;
  $("cam").style.transform = `translate(${VW / 2 - cam[0] * z}px, ${VH / 2 - cam[1] * z}px) scale(${z})`;
  $("cam").style.opacity = cut ? clamp(fresh / 0.12) : 1;

  // drag ghost (the Fluent icon from the DMG window)
  const gh = $("ghost");
  if (s.drag && lb >= s.drag.at && lb < s.drag.at + s.drag.dur + 0.4) {
    const d = s.drag, [cx, cy, w, h] = d.crop;
    const k = inout((lb - d.at) / d.dur);
    const x = d.from[0] + (d.to[0] - d.from[0]) * k, y = d.from[1] + (d.to[1] - d.from[1]) * k;
    gh.style.display = "block"; gh.style.width = w + "px"; gh.style.height = h + "px";
    gh.style.backgroundPosition = `-${cx}px -${cy}px`;
    gh.style.left = (x - w / 2) + "px"; gh.style.top = (y - h / 2) + "px";
    gh.style.opacity = lb > d.at + d.dur ? 0.92 * (1 - (lb - d.at - d.dur) / 0.4) : 0.92;
  } else gh.style.display = "none";

  // typing into the key field
  const ty = $("typed");
  if (s.typing && lb >= s.typing.at) {
    const [x, y, w, h] = s.typing.box, n = Math.floor(s.typing.text.length * clamp((lb - s.typing.at) / s.typing.dur));
    ty.style.display = "block"; Object.assign(ty.style, {left: x + "px", top: y + "px", width: w + "px", height: h + "px"});
    ty.textContent = s.typing.text.slice(0, Math.max(1, n));
  } else ty.style.display = "none";

  renderCursor(s, lb);
}
</script>
</body>
</html>
